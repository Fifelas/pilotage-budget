# Compile l'APK Android signé et le publie dans les Releases.
# Lancement : onglet Actions > « Publier une version Android » > Run workflow > saisir la version (ex. 0.2.0)
name: Publier une version Android
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version (ex. 0.2.0)"
        required: true
      notes:
        description: "Nouveautés (affichées dans la Release)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le numéro de version
        run: echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || (echo "Version attendue au format 1.2.3" && exit 1)
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Appliquer le numéro de version
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm run build
      - name: Générer le projet Android
        run: |
          npx cap add android
          npx cap sync android
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"${{ inputs.version }}\"/" android/app/build.gradle
      - name: Préparer la clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Secret ANDROID_KEYSTORE_BASE64 manquant (voir README)"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Compiler l'APK signé
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/pilotage-budget-${{ inputs.version }}.apk"
      - name: Enregistrer la version dans le dépôt
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Version ${{ inputs.version }}" || true
          git push || true
      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Pilotage budget ${{ inputs.version }}
          body: ${{ inputs.notes }}
          files: pilotage-budget-${{ inputs.version }}.apk
